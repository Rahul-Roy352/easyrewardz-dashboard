<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/10308/10308112.png"> <!-- Favicon added -->
<title>Easyrewardz Link Hub</title>
<link rel="stylesheet" href="styles.css"/>
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
/>
</head>
<body>

<!-- <div class="login-screen" id="loginScreen"> -->
  <div class="login-screen" id="vanta-bg">

  <!-- <div id="particles-js"></div> -->

  <div class="login-box" id="loginBox">

    <h1>🔒 Easyrewardz Link Hub</h1>

    <p>Authorized Access Only</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="Enter Password"
    >

    <button id="loginBtn">
      Access Dashboard
    </button>

    <div id="loginStatus"></div>

  </div>

</div>

<div class="app">

<aside class="sidebar">
  <h2>Dashboard</h2>
  <button class="nav-btn active" data-view="home">🏠 <span>Home</span></button>
  <h2 style="margin-top:14px;">Countries</h2>
  <button class="nav-btn" data-view="IN"><img class="flag" src="https://flagcdn.com/in.svg"><span>India</span><span class="code">IN</span></button>
  <button class="nav-btn" data-view="BD"><img class="flag" src="https://flagcdn.com/bd.svg"><span>Bangladesh</span><span class="code">BD</span></button>
  <button class="nav-btn" data-view="PK"><img class="flag" src="https://flagcdn.com/pk.svg"><span>Pakistan</span><span class="code">PK</span></button>
  <button class="nav-btn" data-view="MY"><img class="flag" src="https://flagcdn.com/my.svg"><span>Malaysia</span><span class="code">MY</span></button>
  <button class="nav-btn" data-view="ID"><img class="flag" src="https://flagcdn.com/id.svg"><span>Indonesia</span><span class="code">ID</span></button>
  <button class="nav-btn" data-view="TH"><img class="flag" src="https://flagcdn.com/th.svg"><span>Thailand</span><span class="code">TH</span></button>
  <button class="nav-btn" data-view="SG"><img class="flag" src="https://flagcdn.com/sg.svg"><span>Singapore</span><span class="code">SG</span></button>
</aside>

<main class="main">
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="title" id="viewTitle">Home</div>
    <input class="search" id="search" placeholder="🔍 Search links..." />
  </div>

  <!-- <div class="glass add-panel" style="display:none;">
    <h3>➕ Add Link</h3>
    <div class="add-grid">
      <input id="linkName" placeholder="Link Name" />
      <input id="linkUrl" placeholder="https://example.com" />
      <select id="linkCategory"></select>
      <button class="btn" id="addBtn">Add</button>
    </div>
  </div> -->

  <div id="content"></div>
  <footer class="footer">
  <div class="footer-content">
    <span class="footer-brand">Easyrewardz Dashboard</span>
    <span class="footer-divider">•</span>
    <span class="footer-author">Developed by Rahul</span>
  </div>
</footer>
</main>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Edit Link</h3>
    <input id="editName" placeholder="Link Name" />
    <input id="editUrl" placeholder="URL" />
    <select id="editCategory"></select>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelEdit">Cancel</button>
      <button class="btn" id="saveEdit">Save</button>
    </div>
  </div>
</div>

<!-- <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
<script src="script.js"></script>
</body>
</html>
